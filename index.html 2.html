        h1 {
            text-align: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

        .card {
            background: white;

            overflow: hidden;

            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .price {
            color: purple;
            font-weight: bold;
        }

        .category-title {
            margin-top: 30px;
            padding-left: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
